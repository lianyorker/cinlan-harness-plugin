- name: '@cinlan/clh-knowledge-sync'
  config:
    node:
      id: node-b
      token: token-b
    hub:
      activeProfile: intranet
      profiles:
        intranet:
          protocol: http
          host: '127.0.0.1'
          port: 47610
          timeoutMs: 5000
    sync:
      auto: false
      intervalSec: 3
      syncOnStart: false
      memoryDir: ./memory
      skillRoots:
        - ./skills
      stateDirName: .clh-knowledge-sync
    oneshot:
      enabled: true
      commands: ["pull"]
      resultFile: './oneshot-node-b-pull3.json'
    log:
      level: info
