# dsh MCP 条目模板（stdio，A1）
# 落点：$DSH_HOME/cordis.patch.yml（默认 ~/.dsh/cordis.patch.yml，对所有 profile 生效）
#       或 $DSH_HOME/profiles/<profile>/cordis.patch.yml（只对一个 profile 生效）
# 本文件是 ck 生成的等价物，`ck setup --host dsh --agent <t>/<n> --write` 的输出应与此一致。
# 占位符：{{CK_ENTRY}} = ck 入口绝对路径（lib/bin.js）；{{AGENT}} = <team>/<name>
# 约束：serverName 必须匹配 [A-Za-z0-9_-]{1,32} 且在同一注册作用域内唯一；工具名形如 mcp__ck__<tool>。

- insert:
    - id: cinlan-knowledge
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ck
        transport: stdio
        command: node
        args: ['{{CK_ENTRY}}', 'mcp', '--host', 'dsh', '--agent', '{{AGENT}}', '--baseline', 'full']
